<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcement</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#ffde59,#ff5c8a,#00d1ff,#00ff9c);background-size:300% 300%;animation:bgMove 8s ease infinite;color:#111;padding:20px}
@keyframes bgMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wrap{max-width:1200px;margin:auto}
.hero{background:#fff;border:6px solid #111;box-shadow:12px 12px 0 #111;border-radius:28px;padding:32px;margin-bottom:30px}
.badge{display:inline-block;background:#00ff9c;border:4px solid #111;box-shadow:5px 5px 0 #111;border-radius:999px;padding:10px 18px;font-size:13px;margin-bottom:18px}
h1{font-size:clamp(40px,7vw,80px);line-height:.95;text-transform:uppercase}
.hero p{margin-top:15px;font-size:18px;font-family:Arial,sans-serif;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px}
.card{background:#fff;border:6px solid #111;box-shadow:10px 10px 0 #111;border-radius:24px;overflow:hidden;transition:.25s}
.card:hover{transform:translate(-6px,-6px) rotate(-1deg);box-shadow:16px 16px 0 #111}
.imgbox{height:220px;background:#ffde59;border-bottom:6px solid #111}
img{width:100%;height:100%;object-fit:cover}
.content{padding:22px}
h2{font-size:28px;line-height:1.1;margin-bottom:12px;text-transform:uppercase}
.text{font-family:Arial,sans-serif;font-weight:800;line-height:1.6;white-space:pre-wrap}
.date{display:inline-block;margin-top:18px;background:#ffde59;border:4px solid #111;box-shadow:4px 4px 0 #111;border-radius:12px;padding:9px 12px;font-size:13px}
button,input{border:4px solid #111;box-shadow:4px 4px 0 #111;border-radius:14px;padding:12px;font-weight:900;background:#fff;outline:none}
button{cursor:pointer;background:#00ff9c;transition:.2s}
button:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 #111}
.liked{background:#ff5c8a;color:#fff}
.actions{margin-top:18px}
.comment-box{margin-top:20px;border-top:5px solid #111;padding-top:18px}
.comment-form,.replyForm{display:flex;flex-direction:column;gap:10px}
.comments{display:grid;gap:14px;margin-top:18px}
.comment{background:#ffde59;border:4px solid #111;box-shadow:4px 4px 0 #111;border-radius:16px;padding:14px;font-family:Arial,sans-serif;font-weight:800;line-height:1.5}
.comment-name{font-size:15px;font-weight:900}
.comment-text{margin-top:6px}
.reply-list{display:grid;gap:10px;margin-top:12px}
.reply{background:#00d1ff;border:4px solid #111;box-shadow:4px 4px 0 #111;border-radius:14px;padding:12px}
.reply.admin{background:#00ff9c}
.replyForm{margin-top:12px}
.empty{background:#fff;border:6px solid #111;box-shadow:10px 10px 0 #111;border-radius:24px;padding:30px;text-align:center;font-size:24px}
#toast{position:fixed;top:20px;right:20px;background:#00ff9c;border:5px solid #111;box-shadow:7px 7px 0 #111;border-radius:16px;padding:14px 18px;font-weight:900;z-index:9999;transform:translateX(150%);transition:.3s}
#toast.show{transform:translateX(0)}
@media(max-width:600px){body{padding:14px}.hero{padding:22px}h1{font-size:44px}.imgbox{height:190px}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
<section class="hero">
<span class="badge">BY WHYUSKIEEE</span>
<h1>Announcement</h1>
<p>GABUT KOMEN AJA NYAKKK</p>
</section>
<main id="announcementList" class="grid"></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, increment, addDoc, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyComJhb1CuOywEv9898Epxz9Xh2GU9_V9k",
authDomain:"whyuskieee-announcement.firebaseapp.com",
projectId:"whyuskieee-announcement",
storageBucket:"whyuskieee-announcement.firebasestorage.app",
messagingSenderId:"1062750960176",
appId:"1:1062750960176:web:c25643b4503ef012f84bf5",
measurementId:"G-7D7VW3PER6"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const list=document.getElementById("announcementList");
const toast=document.getElementById("toast");

function showToast(text){
toast.textContent=text;
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),2500);
}

function clean(t){
return String(t||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

const q=query(collection(db,"announcements"),orderBy("createdAt","desc"));

onSnapshot(q,snapshot=>{
list.innerHTML="";

if(snapshot.empty){
list.innerHTML=`<div class="empty">Belum ada announcement.</div>`;
return;
}

snapshot.forEach(item=>{
const data=item.data();
const id=item.id;
const date=data.createdAt?.toDate?data.createdAt.toDate().toLocaleString("id-ID"):"Tanggal belum tersedia";
const liked=localStorage.getItem("liked_"+id);

const card=document.createElement("article");
card.className="card";
card.innerHTML=`
<div class="imgbox">
<img src="${clean(data.imageUrl)||"https://placehold.co/900x500/ffde59/111?text=ANNOUNCEMENT"}">
</div>
<div class="content">
<h2>${clean(data.title)||"Tanpa Judul"}</h2>
<p class="text">${clean(data.content)||""}</p>
<span class="date">${date}</span>
<div class="actions">
<button class="likeBtn ${liked?"liked":""}" data-id="${id}">❤️ ${data.likes||0}</button>
</div>
<div class="comment-box">
<form class="comment-form" data-id="${id}">
<input type="text" class="nameInput" placeholder="Nama kamu..." required>
<input type="text" class="commentInput" placeholder="Tulis komentar..." required>
<button type="submit">Kirim Komentar</button>
</form>
<div class="comments" id="comments-${id}"></div>
</div>
</div>
`;
list.appendChild(card);

const commentsRef=query(collection(db,"announcements",id,"comments"),orderBy("createdAt","desc"));

onSnapshot(commentsRef,commentSnap=>{
const commentsBox=document.getElementById(`comments-${id}`);
if(!commentsBox)return;
commentsBox.innerHTML="";

if(commentSnap.empty){
commentsBox.innerHTML=`<div class="comment">Belum ada komentar.</div>`;
return;
}

commentSnap.forEach(c=>{
const cm=c.data();
const replies=cm.replies||[];
const div=document.createElement("div");
div.className="comment";
div.innerHTML=`
<div class="comment-name">${clean(cm.name)||"Anonim"}</div>
<div class="comment-text">${clean(cm.text)||""}</div>
<div class="reply-list">
${replies.map(r=>`
<div class="reply ${r.role==="admin"?"admin":""}">
<b>${r.role==="admin"?"Admin":clean(r.name||"Anonim")}</b>
<p>${clean(r.text||"")}</p>
</div>
`).join("")}
</div>
<form class="replyForm" data-aid="${id}" data-cid="${c.id}">
<input type="text" class="replyName" placeholder="Nama kamu..." required>
<input type="text" class="replyText" placeholder="Balas komentar ini..." required>
<button type="submit">Balas</button>
</form>
`;
commentsBox.appendChild(div);
});
});
});

document.querySelectorAll(".likeBtn").forEach(btn=>{
btn.onclick=async()=>{
const id=btn.dataset.id;
if(localStorage.getItem("liked_"+id)){
showToast("Kamu sudah like announcement ini ❤️");
return;
}
await updateDoc(doc(db,"announcements",id),{likes:increment(1)});
localStorage.setItem("liked_"+id,"true");
btn.classList.add("liked");
showToast("Like berhasil dikirim ❤️");
};
});

document.querySelectorAll(".comment-form").forEach(form=>{
form.onsubmit=async e=>{
e.preventDefault();
const name=form.querySelector(".nameInput").value.trim();
const text=form.querySelector(".commentInput").value.trim();
if(!name||!text)return;

await addDoc(collection(db,"announcements",form.dataset.id,"comments"),{
name,
text,
replies:[],
createdAt:serverTimestamp()
});

form.reset();
showToast("Komentar berhasil terkirim ✅");
};
});
});

document.addEventListener("submit",async e=>{
if(!e.target.classList.contains("replyForm"))return;
e.preventDefault();

const form=e.target;
const name=form.querySelector(".replyName").value.trim();
const text=form.querySelector(".replyText").value.trim();

if(!name||!text)return;

await updateDoc(doc(db,"announcements",form.dataset.aid,"comments",form.dataset.cid),{
replies:arrayUnion({
name,
text,
role:"user",
createdAt:Date.now()
})
});

form.reset();
showToast("Balasan berhasil terkirim ✅");
});
</script>

  });
</script>

<script>
document.addEventListener("contextmenu",e=>e.preventDefault());

document.onkeydown=function(e){

if(e.keyCode==123)return false;

if(e.ctrlKey&&e.shiftKey&&e.keyCode==73)return false;

if(e.ctrlKey&&e.keyCode==85)return false;

};
</script>
  
</body>
</html>
